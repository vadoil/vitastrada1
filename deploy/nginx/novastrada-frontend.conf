server {
  listen 80;
  listen [::]:80;
  server_name novastrada.ru www.novastrada.ru;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name novastrada.ru www.novastrada.ru;

  # ssl_certificate / ssl_certificate_key — допишет certbot

  root /var/www/novastrada/dist;
  index index.html;

  # SPA fallback
  location / {
    try_files $uri /index.html;
  }

  # статика с длинным кэшем
  location ~* \.(?:js|css|png|jpg|jpeg|svg|webp|woff2?|mp4|ico)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # gzip (если не включён глобально)
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
  gzip_min_length 1024;
}
